<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buildadiv · Vanilla shop</title>
    <link rel="stylesheet" href="./style.css" />
    <!-- Workspace packages import the private shared package by name; map it for the browser. -->
    <script type="importmap">
      { "imports": { "@buildadiv/shared/": "/packages/shared/" } }
    </script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <h1>Vanilla shop</h1>
    <p>Native browser imports, HTML templates, and ordinary event listeners.</p>
    <use-template id="layout" template="panel">
      <h2 slot="heading">Products</h2>
      <p>The list stays current after mutations.</p>
    </use-template>
    <ul id="products">
      <use-template
        subscribe="loadProducts"
        on-pending="pending"
        on-success="product-rows"
        on-error="failure"
      ></use-template>
    </ul>
    <use-template id="count" subscribe="loadProducts" on-success="count"></use-template>
    <button id="rename">Rename scarf</button>
    <button data-action="importProducts">Import products</button>
    <template data-component="panel"
      ><section class="panel">
        <header><slot name="heading">Heading</slot></header>
        <slot>Panel content</slot>
      </section></template
    >
    <template
      data-component="product-rows"
      data-accepts="array"
      data-item="product"
      data-index="i"
      data-key="id"
    >
      <li>
        <strong data-bind="product.name">Product name</strong>
        <span data-bind="product.price | currency:EUR">€0.00</span>
        <span data-if="product.inStock">In stock</span
        ><span data-if-not="product.inStock">Sold out</span>
        <button class="local">Local button</button>
      </li>
    </template>
    <template data-component="pending"><p>Loading…</p></template>
    <template data-component="failure"
      ><p role="alert">
        Request failed: <span data-bind="context.statusCode | fallback:'network'">Status</span>
      </p></template
    >
    <template data-component="count"
      ><p><span data-bind="response.length">0</span> products</p></template
    >
  </body>
</html>
